Mutelist:
  Accounts:
    '*':
      Checks:
        guardduty_is_enabled:
          Regions:
            - '*'
          Resources:
            - '*'
        guardduty_delegated_admin_enabled_all_regions:
          Regions:
            - '*'
          Resources:
            - '*'
        securityhub_enabled:
          Regions:
            - '*'
          Resources:
            - '*'
        s3_bucket_public_access:
          Regions:
            - eu-west-1
          Resources:
            - inbo-aloft-uat-eu-west-1-default
            - aloftdata
        s3_bucket_public_list_acl:
          Regions:
            - eu-west-1
          Resources:
            - inbo-aloft-uat-eu-west-1-default
            - aloftdata
        s3_bucket_level_public_access_block:
          Regions:
            - eu-west-1
          Resources:
            - inbo-aloft-uat-eu-west-1-default
            - aloftdata
        iam_root_hardware_mfa_enabled:
          Regions:
            - '*'
          Resources:
            - '*'
        ecs_service_no_assign_public_ip:
          Regions:
            - eu-west-1
          Resources:
            - inbo-adviezen-cluster/webdav-service
        inspector2_active_findings_exist:
          Regions:
            - '*'
          Resources:
            - '*'
        iam_role_administratoraccess_policy:
          Regions:
            - '*'
          Resources:
            - OrganizationAccountAccessRole
            - inbo-devops-role
            - inbo-devops-github-actions-deployer-role
            - stacksets-exec-*
            - '*QuickSetup*'
        iam_user_administrator_access_policy:
          Regions:
            - '*'
          Resources:
            - bert.huygens@inbo.be
        awslambda_function_no_secrets_in_code:
          Regions:
            - eu-west-1
          Resources:
            - inbo-vbp-biocache-index-management
            - inbo-watina-pressuremeasurement-status-change-function
            - inbo-watina-calibration-function
            - inbo-ckan-password-rotation-ec2
            - inbo-waterbirds-password-rotation-dbuser
        s3_account_level_public_access_blocks:
          Regions:
            - '*'
          Resources:
            - '*'
        iam_root_credentials_management_enabled:
          Regions:
            - '*'
          Resources:
            - '*'
        awslambda_function_no_secrets_in_variables:
          Regions:
            - eu-west-1
          Resources:
            - inbo-watina-calibration-function
            - inbo-watina-pressuremeasurement-status-change-function
            - inbo-vbp-species-lists-api
        ecs_task_definitions_no_environment_secrets:
          Regions:
            - eu-west-1
          Resources:
            - inbo-bodem-dov-etl:*
            - inbo-watina-dov-etl:*
            - inbo-bobo-app:*
            - inbo-inboveg-app:*
            - inbo-keycloak-app:*
            - inbo-vis-app:*
            - inbo-waterbirds-app:*
            - inbo-watina-app:*
        iam_role_cross_account_readonlyaccess_policy:
          Regions:
            - '*'
          Resources:
            - SnowOrganizationAccount*
            - inbo-biodiversiteitsportaal-developers-role
            - inbo-developers-role
        iam_inline_policy_allows_privilege_escalation:
          Regions:
            - '*'
          # Findings hebben het formaat RoleName/PolicyName -> wildcard-suffix nodig.
          # Allemaal by-design: Session Manager (ssm:StartSession) / ecs:ExecuteCommand /
          # ssm:SendCommand, geen iam:PassRole. Zie mutelist-verantwoording.md.
          Resources:
            - StackSet-CloudHealthRoleUpdate--LambdaExecutionRole-*
            - inbo-faunabeheer-shinyproxy-wbe-task-role*
            - inbo-faunabeheer-shinyproxy-faunabeheer-task-role*
            - inbo-bodem-role*
            - inbo-aloft-eventbridge-scheduler*
            - BillingConsolePolicyMigratorRole*
            - inbo-watina-github-actions-deploy-lambda-role*
            - inbo-exotenportaal-shinyproxy-task-role*
            - inbo-watina-dov-role*
            - inbo-vbp-pipelines-emr-service-role*
            - inbo-mne-sampling-developers-role*
            - inbo-ckan-developer-role*
            - inbo-ckan-lambda-secret-rotation-role*
            - inbo-vertigis-developer-role*
            - inbo-vertigis-external-siggis-user*
            - inbo-riparias-scheduler*
            - inbo-n2kmonitoring-analytics-role*
        iam_policy_allows_privilege_escalation:
          Regions:
            - '*'
          Resources:
            - inbo-vbp-start-pipelines-policy
            - inbo-github-runners-lambda-execution-policy
            - inbo-vbp-additional-dev-permissions
            # By-design Session Manager / boundary policies, geen iam:PassRole.
            - inbo-developers-policy
            - inbo-bastion-bastion-ssm-policy
            - inbo-auditor-role-boundary
        ecs_task_definitions_containers_readonly_access:
          Regions:
            - eu-west-1
          Resources:
            - adviezen-webdav:*
            - vespadb-*
            - inbo-aloft-*
            - inbo-waterbirds-*
            - inbo-mne-*
            - inbo-vbp-spatial-service:*
        iam_role_cross_service_confused_deputy_prevention:
          Regions:
            - '*'
          Resources:
            - '*CloudHealth*'
            - '*QuickSetup*'
        ec2_instance_with_outdated_ami:
          Regions:
            - eu-west-1
          Resources:
            - i-09cc110fbb1f04ed4
            - i-0ceda6bc49989921f
        iam_aws_attached_policy_no_administrative_privileges:
          Regions:
            - '*'
          Resources:
            - AdministratorAccess
        secretsmanager_automatic_rotation_enabled:
          Regions:
            - '*'
          Resources:
            - '*'
          Exceptions:
            Resources:
              - '*/rds/*'
        # IAM-access wordt als afdoende beschouwd voor alle secrets, incl. RDS.
        # Eerder bleven RDS-secrets via Exceptions zichtbaar; nu volledig gemute.
        secretsmanager_has_restrictive_resource_policy:
          Regions:
            - '*'
          Resources:
            - '*'
    '625469168093':
      Checks:
        ecs_task_definitions_containers_readonly_access:
          Regions:
            - eu-west-1
          Resources:
            - 'sp-task-definition-*'
        iam_role_cross_service_confused_deputy_prevention:
          Regions:
            - '*'
          Resources:
            - 'inbo-waterbirds-*'
        s3_bucket_cross_account_access:
          Regions:
            - eu-west-1
          Resources:
            - inbo-aloft-uat-eu-west-1-default
            - inbo-exotenportaal-uat-eu-west-1-default
        ecs_service_no_assign_public_ip:
          Regions:
            - eu-west-1
          Resources:
            - webdav-service
    '347082780157':
      Checks:
        rds_instance_transport_encrypted:
          Regions:
            - eu-west-1
          Resources:
            - inbo-utility-shared-infra
    '800040084629':
      Checks:
        ecs_task_definitions_containers_readonly_access:
          Regions:
            - eu-west-1
          Resources:
            - 'sp-task-definition-*'
            - 'inbo-aws-bodem-etl:2'
        iam_role_cross_service_confused_deputy_prevention:
          Regions:
            - '*'
          Resources:
            - 'inbo-waterbirds-*'
        s3_bucket_cross_account_access:
          Regions:
            - eu-west-1
          Resources:
            - inbo-meetnetten-prod-export-datawarehouse
            - aloftdata
        ecs_service_no_assign_public_ip:
          Regions:
            - eu-west-1
          Resources:
            - webdav-service
